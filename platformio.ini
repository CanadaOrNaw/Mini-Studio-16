[platformio]
src_dir = .

[env:m5stack-cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_upload.maximum_size = 3080192
board_build.partitions = partitions_dual.csv
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DMS16_FIRMWARE_ROLE=0
build_src_filter =
    +<*.cpp>
    +<Microgroove.ino>
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git#1.1.1
    M5Unified=https://github.com/m5stack/M5Unified.git#0.2.19
    h2zero/NimBLE-Arduino@1.4.2
    adafruit/Adafruit TinyUSB Library@3.1.3

[env:m5stack-cardputer-adv-usb-host]
extends = env:m5stack-cardputer-adv
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DMS16_USB_MIDI_HOST=1
    -DMS16_FIRMWARE_ROLE=1

[env:mini-studio-audio-cap-atom-lite]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    -<*>
    +<audio_cap_firmware/*.cpp>
    +<audio_cap_protocol.cpp>
    +<audio_cap_bridge_core.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.5
