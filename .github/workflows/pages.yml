name: Build and deploy Pages

on:
  push:
    branches: ["main", "agent/v3-alpha-sd-streaming"]
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/START_HERE.md"
      - "docs/FLASHING.md"
      - "docs/AUDIO_CAP_BUILD_GUIDE.md"
      - "docs/AUDIO_CAP_BOM.md"
      - "tools/build_site.py"
      - "tools/check_live_site.py"
      - "tools/generate_hardware_assets.py"
      - "tools/render_audio_cap_bom.py"
      - "tests/test_hardware_assets.py"
      - "tests/test_site_build.py"
      - "tests/test_live_site_check.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/START_HERE.md"
      - "docs/FLASHING.md"
      - "docs/AUDIO_CAP_BUILD_GUIDE.md"
      - "docs/AUDIO_CAP_BOM.md"
      - "tools/build_site.py"
      - "tools/check_live_site.py"
      - "tools/generate_hardware_assets.py"
      - "tools/render_audio_cap_bom.py"
      - "tests/test_hardware_assets.py"
      - "tests/test_site_build.py"
      - "tests/test_live_site_check.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages-config.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
        id: pages-config
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/v3-alpha-sd-streaming'
        # Forks and fresh repositories can validate/download the complete site
        # artifact before an owner enables Pages in Settings. Once enabled,
        # this step succeeds and the deploy job becomes eligible.
        continue-on-error: true
      - name: Verify generated hardware assets
        run: |
          python tools/generate_hardware_assets.py --check
          python tools/render_audio_cap_bom.py --check
      - name: Run CAD and site tests
        run: python -m unittest tests/test_hardware_assets.py tests/test_site_build.py tests/test_live_site_check.py
      - name: Build static site
        run: python tools/build_site.py --output build/pages
      - uses: actions/upload-artifact@v6
        with:
          name: mini-studio-16-pages
          path: build/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages-config.outcome == 'success'
        with:
          path: build/pages

  deploy:
    # The long-running alpha branch is the product's current integration ref.
    # Deploy it during this draft PR; after merge, pushes to main take over.
    if: >-
      needs.build.outputs.pages-ready == 'true' &&
      (github.event_name != 'pull_request' ||
      github.head_ref == 'agent/v3-alpha-sd-streaming')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
