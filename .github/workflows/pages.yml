name: Build and deploy Pages

on:
  push:
    branches: ["main", "agent/v3-alpha-sd-streaming"]
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/START_HERE.md"
      - "docs/FLASHING.md"
      - "docs/AUDIO_CAP_BUILD_GUIDE.md"
      - "docs/AUDIO_CAP_BOM.md"
      - "tools/build_site.py"
      - "tools/check_live_site.py"
      - "tools/generate_hardware_assets.py"
      - "tools/render_audio_cap_bom.py"
      - "tests/test_hardware_assets.py"
      - "tests/test_site_build.py"
      - "tests/test_live_site_check.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/START_HERE.md"
      - "docs/FLASHING.md"
      - "docs/AUDIO_CAP_BUILD_GUIDE.md"
      - "docs/AUDIO_CAP_BOM.md"
      - "tools/build_site.py"
      - "tools/check_live_site.py"
      - "tools/generate_hardware_assets.py"
      - "tools/render_audio_cap_bom.py"
      - "tests/test_hardware_assets.py"
      - "tests/test_site_build.py"
      - "tests/test_live_site_check.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages-config.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
        id: pages-config
        if: github.event_name != 'pull_request' || github.head_ref == 'agent/v3-alpha-sd-streaming'
        # Forks and fresh repositories can validate/download the complete site
        # artifact before an owner enables Pages in Settings. Once enabled,
        # this step succeeds and the deploy job becomes eligible.
        continue-on-error: true
      - name: Verify generated hardware assets
        run: |
          python tools/generate_hardware_assets.py --check
          python tools/render_audio_cap_bom.py --check
      - name: Run CAD and site tests
        run: python -m unittest tests/test_hardware_assets.py tests/test_site_build.py tests/test_live_site_check.py
      - name: Build static site
        run: python tools/build_site.py --output build/pages
      - uses: actions/upload-artifact@v6
        with:
          name: mini-studio-16-pages
          path: build/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages-config.outcome == 'success'
        with:
          path: build/pages

  deploy:
    # The long-running alpha branch is the product's current integration ref.
    # Deploy it during this draft PR; after merge, pushes to main take over.
    if: >-
      needs.build.outputs.pages-ready == 'true' &&
      (github.event_name != 'pull_request' ||
      github.head_ref == 'agent/v3-alpha-sd-streaming')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # P2-14 (reconciliation report): the public site actually lives in the
  # separate CanadaOrNaw/MiniStudio.github.io repository and was previously
  # synced by hand with no automated drift check — the deploy job above
  # targets this repo's own Pages, which is a different URL. This job closes
  # that gap: when the SITE_PUSH_TOKEN secret exists (a fine-grained PAT
  # with contents read/write on MiniStudio.github.io only), every push
  # publishes the freshly built tree there and then FAILS the workflow if
  # the live site does not serve this exact commit within ~5 minutes.
  # Without the secret (forks, first-time setup) the job explains itself
  # and exits green; the manual flow remains:
  #   python tools/build_site.py && push build/pages to MiniStudio.github.io
  publish-site:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          name: mini-studio-16-pages
          path: build/pages
      - name: Push built site to MiniStudio.github.io
        id: push
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          if [ -z "$SITE_PUSH_TOKEN" ]; then
            echo "::notice::SITE_PUSH_TOKEN is not configured; site publish skipped. Add a fine-grained PAT (contents: read/write on CanadaOrNaw/MiniStudio.github.io) as the SITE_PUSH_TOKEN repository secret to enable automatic publishing, or publish manually with tools/build_site.py."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${SITE_PUSH_TOKEN}@github.com/CanadaOrNaw/MiniStudio.github.io.git" live-site
          rsync -a --delete --exclude ".git" build/pages/ live-site/
          cd live-site
          git add -A
          # BUILD_INFO.json embeds this commit's SHA, so a push always
          # produces a change; the guard only protects manual re-runs.
          if git diff --cached --quiet; then
            echo "site already current"
          else
            git -c user.name="mini-studio-16-site" \
                -c user.email="mini-studio-16-site@users.noreply.github.com" \
                commit -m "Publish site from Mini-Studio-16@${GITHUB_SHA}"
            git push
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify the live site serves this commit
        if: steps.push.outputs.published == 'true'
        # check_live_site.py re-downloads every manifested asset and compares
        # SHA-256s, so this also proves the CDN finished propagating.
        run: >-
          python tools/check_live_site.py
          --expected-source "$GITHUB_SHA"
          --retries 10 --retry-delay 30
