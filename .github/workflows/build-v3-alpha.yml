name: Build v3 alpha

on:
  push:
    branches: ["codex/v3-alpha-sd-streaming"]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: ./tests/run_host_tests.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "platformio==6.1.19" "esptool==4.8.1"
      - name: Build firmware
        run: pio run -e m5stack-cardputer-adv
      - name: Create merged 8 MB flash image
        run: python tools/merge_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: microgroove-v3-alpha-cardputer-adv
          path: |
            .pio/build/m5stack-cardputer-adv/microgroove-v3-alpha.bin
            .pio/build/m5stack-cardputer-adv/firmware.bin
            .pio/build/m5stack-cardputer-adv/firmware.elf
          if-no-files-found: error
